logLevel: info
logDestinations: [stdout]
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889
apiAddress: :9997

rtsp: yes
rtmp: yes
hls: yes
webrtc: yes
api: yes

hlsAllowOrigin: '*'
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# Default e 60s - muito pouco pra o tempo de conexao+buffer do player mobile
# (ExoPlayer via rede movel/emulador), que as vezes passa disso so pra
# terminar de buscar a playlist master e abrir a conexao pra de midia.
# Sessao fechava antes do player conseguir buscar o proximo nivel.
hlsMuxerCloseAfter: 300s

webrtcAllowOrigin: '*'
# Railway nao aceita trafego UDP de entrada publicamente (so outbound) e
# a porta publica do TCP Proxy e sempre aleatoria - o MediaMTX nao tem
# como anunciar host/porta corretos nos candidatos ICE, entao a midia
# WebRTC nunca conecta direto. Servidor TURN externo (VPS com IP fixo e
# portas sob nosso controle) resolve isso - o MediaMTX so faz conexao
# de SAIDA pro TURN (que o Railway permite), e o TURN vira o ponto
# alcancavel pro cliente externo. username/password via MTX_WEBRTCICESERVERS2_0_*
# (env vars no Railway, nao commitados aqui).
webrtcICEServers2:
  - url: turn:143.95.220.1:3478

authMethod: http
authHTTPAddress: http://vms-platform.railway.internal:8000/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  all_others:
    {}