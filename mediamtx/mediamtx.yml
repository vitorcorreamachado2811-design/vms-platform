logLevel: info
logDestinations: [stdout]
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889
apiAddress: :9997

rtsp: yes
rtmp: yes
hls: yes
webrtc: yes
api: yes

hlsAllowOrigin: '*'
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# Default e 60s - muito pouco pra o tempo de conexao+buffer do player mobile
# (ExoPlayer via rede movel/emulador), que as vezes passa disso so pra
# terminar de buscar a playlist master e abrir a conexao pra de midia.
# Sessao fechava antes do player conseguir buscar o proximo nivel.
hlsMuxerCloseAfter: 300s

webrtcAllowOrigin: '*'

authMethod: http
authHTTPAddress: http://vms-platform.railway.internal:8000/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  all_others:
    {}